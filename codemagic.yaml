workflows:
  ios-release-workflow:
    name: iOS Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Erika Brito"
    environment:
      vars:
        BUNDLE_ID: "com.pedilo.pedidosApp"
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Fetch signing files and create profiles
        script: |
          app-store-connect fetch-signing-files "com.pedilo.pedidosApp" --type IOS_APP_STORE --create
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build Flutter IPA in Release mode
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
