workflows:
  ios-release-workflow:
    name: iOS Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Erika Brito"
    environment:
      vars:
        BUNDLE_ID: "com.pedilo.pedidosApp"
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Flutter IPA in Release mode
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
